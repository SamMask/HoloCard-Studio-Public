<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>AI 推論實測</title>
    <style>
      body { margin: 16px; background: #1e1e24; color: #e8e8ee; font: 14px/1.5 system-ui, sans-serif; }
      button { font: inherit; padding: 4px 12px; margin-right: 6px; }
      pre { white-space: pre-wrap; margin: 8px 0; }
      section { border-top: 1px solid #444; padding: 8px 0; }
      h2 { font-size: 15px; margin: 4px 0; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { font-size: 12px; color: #aab; max-width: 240px; }
      canvas { display: block; max-width: 240px; height: auto; }
      /* 透明的地方看得出來：棋盤格底 */
      canvas.alpha { background: repeating-conic-gradient(#888 0 25%, #555 0 50%) 0 0 / 16px 16px; }
      #three { width: 240px; height: 160px; display: none; }
      .stats { font: 12px/1.4 ui-monospace, monospace; color: #cfd; white-space: pre-wrap; }
    </style>
  </head>
  <body data-state="idle">
    <div>
      <button id="auto">自動（WebGPU 優先）</button>
      <button id="webgpu">強制 WebGPU</button>
      <button id="wasm">強制 WASM（比較用）</button>
      <label><input type="checkbox" id="use-three" /> 同時跑 three.js 動畫（量畫面卡不卡）</label>
    </div>
    <canvas id="three" width="480" height="320"></canvas>
    <pre id="out"></pre>
    <div id="results"></div>
    <script type="module" src="./ai-spike.ts"></script>
  </body>
</html>
